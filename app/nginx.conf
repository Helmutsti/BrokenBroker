server {
  listen 80;
  root /usr/share/nginx/html;

  # Le chiamate all'API: /api/conti → http://api:3000/conti
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # I file dell'app con il nome che cambia a ogni versione si tengono in memoria a lungo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Ogni altro indirizzo (es. /spese-previste) apre l'app, che sceglie la schermata.
  location / {
    try_files $uri /index.html;
  }
}
